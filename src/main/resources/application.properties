spring.application.name=forumhub

# Datasource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}/${DB_NAME:forumhub_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=jdbc:postgresql://${DB_HOST:localhost}/${DB_NAME:forumhub_db}
spring.flyway.user=${DB_USER:postgres}
spring.flyway.password=${DB_PASSWORD:postgres}
spring.flyway.schemas=public
spring.flyway.default-schema=public

# Logging (ajuda a confirmar execução do Flyway no startup)
logging.level.org.flywaydb=INFO

# JWT
api.security.token.secret=senha-secreta
api.security.token.issuer=ForumHub API
api.security.token.expiration=7200000

# SpringDoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true